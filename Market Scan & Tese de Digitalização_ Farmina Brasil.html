}
async function saveRef(){
  const g=id=>modal.querySelector('#'+id).value.trim();
  if(!g('r-titulo')){ setMsg('Escreva o título da referência.'); return; }
  const url=g('r-url'); if(url&&!/^https?:\/\//i.test(url)){ setMsg('O link precisa começar com http:// ou https://'); return; }
  const perguntas=g('r-perg').split(/[,;\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
  const bad=perguntas.filter(c=>!getItem(c)); if(bad.length){ setMsg('Códigos que não existem: '+bad.join(', ')); return; }
  let code=EDITREF.code;
  if(EDITREF._new){ const n=Object.keys(REFS).map(k=>+k.slice(1)||0); code='R'+((n.length?Math.max(...n):0)+1); }
  const data={ code, titulo:g('r-titulo'), fonte:g('r-fonte'), url, dataFonte:g('r-data'), periodo:g('r-per'), tipo:g('r-tipo'), nivel:g('r-nivel'), confiabilidade:g('r-conf'), verificada:g('r-ver'), territorios:[...modal.querySelectorAll('[data-rt]:checked')].map(i=>i.value), perguntas, achado:g('r-ach'), addedAt:(REFS[code]||{}).addedAt||new Date().toISOString(), updatedAt:new Date().toISOString() };
  const btn=modal.querySelector('[data-saveref]'); btn.disabled=true; setMsg('Salvando…');
  try{ await DB.doc('referencias/'+code).set(data); REFS[code]=data; closeModal(); renderAll(); }
  catch{ btn.disabled=false; setMsg('Não foi possível salvar. Tente de novo.'); }
}
async function delRef(){
  const code=EDITREF.code; if(!confirm(`Excluir a referência ${code}?`)) return;
  try{ await DB.doc('referencias/'+code).delete(); delete REFS[code]; closeModal(); renderAll(); }catch{ setMsg('Não foi possível excluir.'); }
}


/* ============ OPORTUNIDADES E DESAFIOS ============ */
const teseName=k=>k==='geral'||!k?'Geral':((ALT[k]||{}).n||k);
function matchMapa(m){
  if(FM.tipo&&m.tipo!==FM.tipo) return false;
  if(FM.tese&&(m.tese||'geral')!==FM.tese) return false;
  if(FM.terr&&!(m.territorios||[]).includes(FM.terr)) return false;
  if(FM.fase&&m.fase!==FM.fase) return false;
  if(FM.status&&(m.status||'ideia')!==FM.status) return false;
  if(!FM.q) return true;
  const q=FM.q.toLowerCase();
  return [m.code,m.titulo,m.descricao,m.implicacao].some(v=>String(v||'').toLowerCase().includes(q));
}
function quadOf(imp,es){ return imp>=4&&es<=2?'qa':imp>=4&&es>=4?'qb':imp<=2&&es<=2?'qc':imp<=2&&es>=4?'qd':'qm'; }
function matrixHtml(pts){
  let h='<div class="mx5-wrap"><div class="mx5" role="table" aria-label="Matriz de esforço (horizontal) e impacto (vertical)">';
  for(let imp=5;imp>=1;imp--){
    h+=`<div class="mx5-y" role="rowheader" title="Impacto ${imp}">${imp}</div>`;
    for(let es=1;es<=5;es++){
      const here=pts.filter(m=>+m.impacto===imp&&+m.esforco===es);
      h+=`<div class="mx5-c ${quadOf(imp,es)}" role="cell">${here.map(m=>`<button class="mk ${m.tipo}" data-openm="${esc(m.code)}" title="${esc(m.titulo)}" aria-label="${esc(m.code)}: ${esc(m.titulo)}">${esc(m.code)}</button>`).join('')}</div>`;
    }
  }
  h+='<div></div>'+[1,2,3,4,5].map(e=>`<div class="mx5-x" title="Esforço ${e}">${e}</div>`).join('');
  return h+'</div></div>';
}
function mapaCard(m){
  const sc=m.tipo!=='insight'&&m.impacto&&m.esforco?`Impacto ${m.impacto} · Esforço ${m.esforco}`:(m.tipo!=='insight'?'Sem pontuação':'');
  const refs=(m.referencias||[]).map(c=>REFS[c]?`<button class="qbtn" data-editref="${esc(c)}" title="${esc(REFS[c].titulo)}">${esc(c)}</button>`:`<span class="tag">${esc(c)}</span>`).join('');
  const qs=(m.perguntas||[]).map(c=>getItem(c)?`<button class="qbtn" data-open="${esc(c)}">${esc(c)}</button>`:`<span class="tag">${esc(c)}</span>`).join('');
  const st=m.status||'ideia';
  return `<article class="mcard ${m.tipo}" data-openm="${esc(m.code)}" role="button" tabindex="0">
   <div class="mh"><span class="mc">${esc(m.code)}</span><span class="st ${st==='priorizada'?'st-respondida':st==='validacao'?'st-parcial':'st-aberta'}">${MAPA_STATUS[st]}</span></div>
   <h4>${esc(m.titulo)}</h4>
   ${m.descricao?`<p class="d">${fmt(cut(m.descricao,380))}</p>`:''}
   ${m.implicacao?`<div class="so"><b>E daí para o go-to-market</b>${fmt(cut(m.implicacao,300))}</div>`:''}
   <div class="tg" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="tag">${esc(teseName(m.tese))}</span>${m.fase?`<span class="tag">${esc((FASES[m.fase]||'').split(' (')[0])}</span>`:''}${m.nivel?`<span class="tag">${NIVEL[m.nivel]}</span>`:''}${(m.territorios||[]).map(k=>`<span class="rg on">${k==='gl'?'GL':(REG.find(x=>x[0]===k)||[0,0,k])[2]}</span>`).join('')}${sc?`<span class="sc">${sc}</span>`:''}</div>
   ${(qs||refs)?`<div class="tg" style="display:flex;gap:6px;flex-wrap:wrap">${qs}${refs}</div>`:''}</article>`;
}
function renderOport(){
  const all=Object.values(MAPA).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true})), list=all.filter(matchMapa);
  const cnt=t=>all.filter(m=>m.tipo===t).length;
  const pts=list.filter(m=>m.tipo!=='insight'&&m.impacto&&m.esforco);
  const unsc=list.filter(m=>m.tipo!=='insight'&&!(m.impacto&&m.esforco)).length;
  const qn=q=>pts.filter(m=>quadOf(+m.impacto,+m.esforco)===q).length;
  const sel=(k,label,opts)=>`<select data-mf="${k}" aria-label="${label}"><option value="">${label}: todos</option>${opts.map(([v,n])=>`<option value="${v}" ${FM[k]===v?'selected':''}>${n}</option>`).join('')}</select>`;
  const sec=(tipo,title,hint)=>{ const l=list.filter(m=>m.tipo===tipo); return `<h3>${title} <span class="hint">${hint}</span></h3><div style="display:flex;gap:8px"><button class="btn-line" data-newm="${tipo}" ${READY?'':'disabled'}>Adicionar ${TIPOS_MAPA[tipo].toLowerCase()}</button></div><div class="mcards">${l.length?l.map(mapaCard).join(''):`<p class="empty-note">${READY?'Nenhum item com esses filtros.':'Carregando…'}</p>`}</div>`; };
  const teseRows=[...Object.keys(ALT),'geral'].map(k=>{ const l=all.filter(m=>(m.tese||'geral')===k); return `<tr><td>${esc(teseName(k))}</td><td style="text-align:center">${l.filter(m=>m.tipo==='oportunidade').length}</td><td style="text-align:center">${l.filter(m=>m.tipo==='desafio').length}</td><td style="text-align:center">${l.filter(m=>m.tipo==='insight').length}</td></tr>`; }).join('');
  return `
  <div class="panel-intro" style="margin-bottom:6px"><h2>Oportunidades e desafios para o go-to-market</h2><p class="theme-desc">Mapa do que a pesquisa indica sobre como a nova estrutura digital da Farmina pode chegar ao mercado brasileiro. Cada item se liga a perguntas e referências e evolui com a pesquisa. Pontuações iniciais, a calibrar conforme a evidência.</p></div>
  <div class="ref-sum">
   <div class="box"><b>${cnt('oportunidade')}</b><span>oportunidades</span></div>
   <div class="box"><b>${cnt('desafio')}</b><span>desafios</span></div>
   <div class="box"><b>${cnt('insight')}</b><span>insights</span></div>
   <div class="box"><b>${all.filter(m=>m.status==='priorizada').length}</b><span>priorizados</span></div>
   <div class="box"><b>${all.filter(m=>m.tipo!=='insight'&&!(m.impacto&&m.esforco)).length}</b><span>sem pontuação</span></div>
  </div>
  <div class="filters" role="search" style="margin-top:14px"><input type="search" placeholder="Buscar por código, título ou texto" value="${esc(FM.q)}" data-mq aria-label="Buscar no mapa">
   ${sel('tipo','Tipo',Object.entries(TIPOS_MAPA))}${sel('tese','Tese',[...Object.keys(ALT).map(k=>[k,ALT[k].n]),['geral','Geral']])}${sel('terr','Território',REG.map(r=>[r[0],r[1]]))}${sel('fase','Fase',Object.entries(FASES))}${sel('status','Status',Object.entries(MAPA_STATUS))}</div>
  <h3>Matriz de esforço e impacto <span class="hint">sombreado mais forte = atacar primeiro</span></h3>
  ${matrixHtml(pts)}
  <div class="legend-mk"><span><span class="mk oportunidade" style="cursor:default">OP1</span> oportunidade (contorno contínuo)</span><span><span class="mk desafio" style="cursor:default">DS1</span> desafio (contorno tracejado)</span><span>Horizontal: esforço, de 1 (baixo) a 5 (alto). Vertical: impacto, de 1 (baixo) a 5 (alto). Em desafios, impacto é o dano se não for resolvido e esforço é o custo de mitigar.</span></div>
  <div class="quad">
   <div class="box"><span class="n">${qn('qa')}</span><b>Alto impacto, baixo esforço</b>Atacar primeiro.</div>
   <div class="box"><span class="n">${qn('qb')}</span><b>Alto impacto, alto esforço</b>Planejar como aposta grande.</div>
   <div class="box"><span class="n">${qn('qc')}</span><b>Baixo impacto, baixo esforço</b>Fazer quando der.</div>
   <div class="box"><span class="n">${qn('qd')}</span><b>Baixo impacto, alto esforço</b>Evitar ou monitorar.</div>
  </div>
  <p class="msg" style="margin-top:8px;text-align:left">${unsc?unsc+' item(ns) sem pontuação não aparece(m) na matriz. ':''}Pontuação 3 fica na faixa intermediária, sem quadrante.</p>
  <h3>Por tese <span class="hint">onde o mapa já tem conteúdo</span></h3>
  <div class="hm-wrap"><table class="hm" style="min-width:520px"><thead><tr><th scope="col">Tese</th><th scope="col">Oportunidades</th><th scope="col">Desafios</th><th scope="col">Insights</th></tr></thead><tbody>${teseRows}</tbody></table></div>
  ${sec('oportunidade','Oportunidades','o que pode abrir espaço para a estrutura no Brasil')}
  ${sec('desafio','Desafios','o que pode atrapalhar ou impedir')}
  ${sec('insight','Insights para o go-to-market','o que a pesquisa ensina sobre como entrar no mercado')}`;
}
function nextMapaCode(tipo){
  const pre=PREFIXO_MAPA[tipo], n=Object.keys(MAPA).filter(k=>k.startsWith(pre)).map(k=>+k.slice(pre.length)||0);
  return pre+((n.length?Math.max(...n):0)+1);
}
function openMapa(code,newTipo){
  const isNew=!code, m=isNew?{tipo:newTipo,territorios:[],perguntas:[],referencias:[],status:'ideia',tese:'geral'}:clone(MAPA[code]);
  if(!isNew&&!MAPA[code]) return;
  EDITMAPA=isNew?{_new:true,tipo:newTipo}:{code,tipo:m.tipo};
  modal.className='modal narrow';
  const opt=(o,v)=>o.map(([a,b])=>`<option value="${a}" ${String(v)===String(a)?'selected':''}>${b}</option>`).join('');
  const sc=[['','—'],[1,'1 (baixo)'],[2,'2'],[3,'3 (médio)'],[4,'4'],[5,'5 (alto)']];
  const ins=m.tipo==='insight';
  const lblI=m.tipo==='desafio'?'Impacto se não for resolvido':'Impacto se der certo', lblE=m.tipo==='desafio'?'Esforço para mitigar':'Esforço para fazer';
  modal.innerHTML=`<div class="m-head"><div><div class="code">${isNew?'Novo':esc(code)}</div><h2 id="m-title">${isNew?'Adicionar '+TIPOS_MAPA[m.tipo].toLowerCase():esc(m.titulo)}</h2><div class="sub">${TIPOS_MAPA[m.tipo]}</div></div><button class="x" data-close aria-label="Fechar">✕</button></div>
   <div class="field"><label for="m-titulo">Título</label><input type="text" id="m-titulo" value="${esc(m.titulo)}"></div>
   <div class="field"><label for="m-desc">Descrição <span class="hint">(o que encontramos, com fonte e data; use ==texto== para grifar o que confirmar na Farmina)</span></label><textarea id="m-desc" rows="5">${esc(m.descricao)}</textarea></div>
   <div class="field"><label for="m-impl">E daí para o go-to-market <span class="hint">(a implicação prática)</span></label><textarea id="m-impl" rows="3">${esc(m.implicacao)}</textarea></div>
   <div class="row2"><div class="field"><label for="m-tese">Tese</label><select id="m-tese">${opt([...Object.keys(ALT).map(k=>[k,ALT[k].n]),['geral','Geral']],m.tese||'geral')}</select></div><div class="field"><label for="m-fase">Fase do go-to-market</label><select id="m-fase"><option value="">—</option>${opt(Object.entries(FASES),m.fase)}</select></div></div>
   ${ins?'':`<div class="row2"><div class="field"><label for="m-imp">${lblI}</label><select id="m-imp">${opt(sc,m.impacto||'')}</select></div><div class="field"><label for="m-esf">${lblE}</label><select id="m-esf">${opt(sc,m.esforco||'')}</select></div></div>`}
   <div class="row2"><div class="field"><label for="m-nivel">Nível da evidência</label><select id="m-nivel"><option value="">—</option>${opt(Object.entries(NIVEL),m.nivel)}</select></div><div class="field"><label for="m-status">Status</label><select id="m-status">${opt(Object.entries(MAPA_STATUS),m.status||'ideia')}</select></div></div>
   <div class="field"><span class="lbl">Territórios</span><div class="checks">${REG.map(r=>`<label><input type="checkbox" data-mt value="${r[0]}" ${(m.territorios||[]).includes(r[0])?'checked':''}>${r[1]}</label>`).join('')}</div></div>
   <div class="row2"><div class="field"><label for="m-perg">Perguntas ligadas <span class="hint">(ex.: Q1.9, Q3.4)</span></label><input type="text" id="m-perg" value="${esc((m.perguntas||[]).join(', '))}"></div><div class="field"><label for="m-refs">Referências ligadas <span class="hint">(ex.: R3, R9)</span></label><input type="text" id="m-refs" value="${esc((m.referencias||[]).join(', '))}"></div></div>
   <div class="m-foot">${isNew?'<span></span>':'<button class="btn btn-d" data-delm>Excluir</button>'}<span class="msg" id="m-msg"></span><div style="display:flex;gap:8px"><button class="btn btn-g" data-close>Cancelar</button><button class="btn btn-p" data-savem>Salvar</button></div></div>`;
  overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false'); modal.querySelector('#m-titulo').focus();
}
async function saveMapa(){
  const g=id=>{ const e=modal.querySelector('#'+id); return e?e.value.trim():''; };
  if(!g('m-titulo')){ setMsg('Escreva o título.'); return; }
  const split=s=>s.split(/[,;\s]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
  const perguntas=split(g('m-perg')), referencias=split(g('m-refs'));
  const badQ=perguntas.filter(c=>!getItem(c)), badR=referencias.filter(c=>!REFS[c]);
  if(badQ.length||badR.length){ setMsg('Códigos que não existem: '+[...badQ,...badR].join(', ')); return; }
  const tipo=EDITMAPA.tipo, code=EDITMAPA._new?nextMapaCode(tipo):EDITMAPA.code;
  const data={ code, tipo, titulo:g('m-titulo'), descricao:g('m-desc'), implicacao:g('m-impl'), tese:g('m-tese')||'geral', fase:g('m-fase'), nivel:g('m-nivel'), status:g('m-status')||'ideia', territorios:[...modal.querySelectorAll('[data-mt]:checked')].map(i=>i.value), perguntas, referencias, origem:(MAPA[code]||{}).origem||'Manual', addedAt:(MAPA[code]||{}).addedAt||new Date().toISOString(), updatedAt:new Date().toISOString() };
  if(tipo!=='insight'){ data.impacto=g('m-imp')?+g('m-imp'):null; data.esforco=g('m-esf')?+g('m-esf'):null; }
  const btn=modal.querySelector('[data-savem]'); btn.disabled=true; setMsg('Salvando…');
  try{ await DB.doc('mapa/'+code).set(data); MAPA[code]=data; closeModal(); renderAll(); }
  catch{ btn.disabled=false; setMsg('Não foi possível salvar. Tente de novo.'); }
}
async function delMapa(){
  const code=EDITMAPA.code; if(!confirm(`Excluir ${code}?`)) return;
  try{ await DB.doc('mapa/'+code).delete(); delete MAPA[code]; closeModal(); renderAll(); }catch{ setMsg('Não foi possível excluir.'); }
}

function show(id,themeId){
  const parent={farmina:'sintese',mercados:'market',b2b:'channels',b2c:'channels'}[id]||id;
  document.querySelectorAll('.tab-btn').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===parent));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
  try{ localStorage.setItem('pw-tab',id); }catch{}
  requestAnimationFrame(()=>{ try{ snPick(); mkPick(); chPick(); }catch{} });
  document.documentElement.classList.toggle('snap-y',['sintese','market','channels'].includes(parent));
  if(themeId){ const el=document.getElementById('th-'+themeId); if(el) el.scrollIntoView({block:'start'}); } else window.scrollTo({top:0});
}
document.addEventListener('click',e=>{
  const t=e.target;
  const tab=t.closest('.tab-btn'); if(tab) return show(tab.dataset.tab);
  const jump=t.closest('[data-jump]'); if(jump) return show(jump.dataset.jump,jump.dataset.theme);
  const op=t.closest('[data-open]'); if(op) return openItem(op.dataset.open);
  const om=t.closest('[data-openm]'); if(om&&!t.closest('.qbtn')) return openMapa(om.dataset.openm);
  const nm=t.closest('[data-newm]'); if(nm&&READY) return openMapa(null,nm.dataset.newm);
  const apv=t.closest('[data-approve]'); if(apv&&EDIT&&!EDIT._new){
    const k=apv.dataset.approve, cur=(EDIT.regioes[k]||{}).revisao, next=cur==='rascunho'?'aprovado':'rascunho';
    (async()=>{ try{ await writeDoc(EDIT.item.code,{regioes:{[k]:{revisao:next}}}); EDIT.regioes[k]=EDIT.regioes[k]||{}; EDIT.regioes[k].revisao=next; ORIG.regioes=ORIG.regioes||{}; ORIG.regioes[k]={...(ORIG.regioes[k]||{}),revisao:next};
      const b=modal.querySelector(`[data-rvbadge="${k}"]`); b.className='rv rv-'+next+' view-only'; b.textContent=next==='rascunho'?'Em revisão':'Validado'; apv.textContent=next==='rascunho'?'Validar':'Reabrir'; setMsg(next==='aprovado'?'Validado.':'Revisão reaberta.'); renderAll(); }catch{ setMsg('Não foi possível salvar a revisão.'); } })();
    return; }
  const eR=t.closest('[data-editreg]'); if(eR){ const rc=modal.querySelector(`[data-rc="${eR.dataset.editreg}"]`); rc.dataset.mode='edit'; rc.querySelector('textarea').focus(); return; }
  const vR=t.closest('[data-viewreg]'); if(vR) return refreshView(vR.dataset.viewreg);
  const eV=t.closest('[data-editvf]'); if(eV){ const vf=modal.querySelector(`[data-vf="${eV.dataset.editvf}"]`); vf.dataset.mode='edit'; vf.querySelector('textarea').focus(); return; }
  if(t.closest('[data-savem]')) return saveMapa();
  if(t.closest('[data-delm]')) return delMapa();
  if(t.closest('[data-newref]')&&READY) return openRef(null);
  const er=t.closest('[data-editref]'); if(er&&READY) return openRef(er.dataset.editref);
  if(t.closest('[data-saveref]')) return saveRef();
  if(t.closest('[data-delref]')) return delRef();
  const nw=t.closest('[data-new]'); if(nw&&READY) return openItem(null,nw.dataset.new);
  const te=t.closest('[data-theme-edit]'); if(te&&READY) return openTheme(te.dataset.themeEdit);
  const st=t.closest('[data-st]'); if(st){ F.st=st.dataset.st; renderAll(); return; }
  const cp=t.closest('[data-copy]'); if(cp){ const txt=document.getElementById(cp.dataset.copy).textContent; (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{cp.textContent='Copiado';},()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById(cp.dataset.copy)); const s=getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent='Texto selecionado: copie com Ctrl+C'; }); return; }
  if(t.closest('[data-close]')||t===overlay) return closeModal();
  if(t.closest('[data-save]')) return save();
  if(t.closest('[data-save-theme]')) return saveTheme();
  if(t.closest('[data-save-tese]')) return saveTese();
  const lb=t.closest('[data-linkbtn]'); if(lb){ const row=modal.querySelector(`[data-linkrow="${lb.dataset.linkbtn}"]`); row.hidden=!row.hidden; return; }
  const al=t.closest('[data-addlink]'); if(al) return addLink(al.dataset.addlink);
  const rm=t.closest('[data-rmdoc]'); if(rm) return removeDoc(rm.dataset.rmdoc);
  if(t.closest('[data-del]')) return delItem();
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-file]')) return uploadFile(e.target);
  if(e.target.matches('[data-regsel]')){ F.reg=e.target.value; renderAll(); }
  if(e.target.matches('[data-revsel]')){ F.rev=e.target.value; renderAll(); }
  if(e.target.matches('[data-mf]')){ FM[e.target.dataset.mf]=e.target.value; renderAll(); }
  if(e.target.matches('[data-rf]')){ FR[e.target.dataset.rf]=e.target.value; renderAll(); }
});
let qTimer;
document.addEventListener('input',e=>{
  if(e.target.matches('[data-rc] [data-f="texto"]')){ const k=e.target.closest('[data-rc]').dataset.rc, p=modal.querySelector(`[data-prev="${k}"]`); if(p){ p.hidden=!e.target.value.includes('=='); p.innerHTML=fmt(e.target.value); } return; }

  if(e.target.matches('[data-rq]')){ clearTimeout(qTimer); const v=e.target.value, pos=e.target.selectionStart; qTimer=setTimeout(()=>{ FR.q=v; renderAll(); const inp=document.querySelector('.tab-panel.active [data-rq]'); if(inp){ inp.focus(); inp.setSelectionRange(pos,pos); } },250); return; }
  if(!e.target.matches('[data-q]')) return;
  clearTimeout(qTimer); const v=e.target.value, pos=e.target.selectionStart;
  qTimer=setTimeout(()=>{ F.q=v; renderAll(); const inp=document.querySelector('.tab-panel.active [data-q]'); if(inp){ inp.focus(); inp.setSelectionRange(pos,pos); } },250);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.mcard[data-openm]')){ e.preventDefault(); return openMapa(e.target.dataset.openm); }
  if(e.key==='Escape'&&overlay.classList.contains('open')) closeModal();
  const tb=e.target.closest&&e.target.closest('.tab-btn');
  if(tb&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){ const ids=TABS.filter(t=>!t.hidden).map(t=>t.id), i=ids.indexOf(tb.dataset.tab), n=(i+(e.key==='ArrowRight'?1:-1)+ids.length)%ids.length; show(ids[n]); document.getElementById('tab-'+ids[n]).focus(); }
});

renderTabs(); renderAll();
(async()=>{
  const conn=document.getElementById('conn'), banner=document.getElementById('banner');
  const cl=window.claude; DB=cl?await cl.use('db'):null;
  if(!DB){ conn.textContent='Sem conexão com o armazenamento'; banner.textContent='Abra esta página pelo link publicado, com a sua conta, para ver e editar as respostas.'; banner.classList.add('show'); return; }
  ASSETS=await cl.use('assets');
  conn.textContent=ASSETS?'':'Somente leitura para arquivos';
  const onErr=err=>{ conn.textContent='Conexão interrompida'; banner.textContent=err?.code==='revoked'?'O acesso a este pre-work mudou. Recarregue a página.':'A conexão com o armazenamento caiu. Recarregue a página.'; banner.classList.add('show'); };
  DB.collection('respostas').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>{ const v=d.data(); if(v) n[d.id]={...v,code:v.code||d.id}; }); RESP=n; READY=true; renderAll(); },onErr);
  DB.collection('temas').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>{ const v=d.data(); if(v) n[d.id]=v; }); TEMAS=n; renderAll(); },onErr);
  DB.collection('referencias').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>{ const v=d.data(); if(v) n[d.id]={...v,code:v.code||d.id}; }); REFS=n; renderAll(); },onErr);
  DB.collection('mapa').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>{ const v=d.data(); if(v) n[d.id]={...v,code:v.code||d.id}; }); MAPA=n; renderAll(); },onErr);
  DB.collection('premissas').onSnapshot(s=>{ const n={}; s.docs.forEach(x=>{ const v=x.data(); if(v) n[x.id]=v; }); PREM=n; renderAll(); },onErr);
  DB.collection('dadosfarmina').onSnapshot(s=>{ const n={}; s.docs.forEach(x=>{ const v=x.data(); if(v) n[x.id]=v; }); FD=n; renderAll(); },onErr);
  DB.doc('tese/main').onSnapshot(s=>{ TESE=s.exists?s.data():{}; renderAll(); },onErr);
})();

</script>
</body>
</html>

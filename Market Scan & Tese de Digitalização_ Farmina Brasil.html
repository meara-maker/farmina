<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Scan &amp; Tese de Digitalização: Farmina Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#006AB5; --deep:#143560; --light:#479EDB;
  --paper:#FFFFFF; --card:#F4F8FC; --line:#D3E1EF; --muted:#4A5F7A; --ink:#143560; --tint:#E3EEF8;
  --alert-bg:#143560; --alert-ink:#FFFFFF;
  --radius:14px; --radius-sm:8px;
  --sans:'Instrument Sans','Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:var(--sans); background:var(--paper); color:var(--ink); line-height:1.5; font-size:15px; }
button, input, select, textarea{ font:inherit; color:inherit; }
.wrap{ max-width:none; margin:0; padding:22px 20px 64px; }
.header{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:22px; }
.kicker{ font-size:13px; color:var(--muted); margin-bottom:6px; }
h1{ font-size:clamp(24px,3.2vw,34px); font-weight:700; letter-spacing:-0.02em; line-height:1.15; }
.lede{ color:var(--muted); margin-top:8px; }
.conn{ font-size:12.5px; color:var(--muted); }

.st{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; white-space:nowrap; }
.st-aberta, .st-naopreenchido{ border:1px solid var(--line); color:var(--muted); background:#fff; }
.st-preenchido{ background:var(--primary); color:#fff; }
.st-parcial{ border:1.5px dashed var(--primary); color:var(--primary); background:#fff; }
.st-respondida{ background:var(--primary); color:#fff; }
.st-derruba{ background:var(--alert-bg); color:var(--alert-ink); }
.st-derruba::before{ content:'⚠'; }

.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:22px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tab-btn{ font-size:14.5px; font-weight:600; background:none; border:none; color:var(--muted); padding:12px 15px; cursor:pointer; position:relative; white-space:nowrap; }
.tab-btn .n{ font-family:var(--mono); font-size:11.5px; margin-left:6px; color:var(--muted); }
.tab-btn:hover{ color:var(--ink); }
.tab-btn[aria-selected="true"]{ color:var(--primary); }
.tab-btn[aria-selected="true"]::after{ content:''; position:absolute; left:10px; right:10px; bottom:-1px; height:3px; border-radius:3px 3px 0 0; background:var(--primary); }
:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }
.tab-panel{ display:none; } .tab-panel.active{ display:block; }

h2{ font-size:21px; font-weight:700; letter-spacing:-0.01em; }
h3{ font-size:16px; font-weight:700; margin:30px 0 12px; }
h3 .hint{ font-weight:400; color:var(--muted); font-size:13.5px; margin-left:6px; }
h4{ font-size:13.5px; font-weight:700; margin-bottom:6px; }
.muted{ color:var(--muted); }
.box{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; }

/* justificado */
.lede, .theme-desc, .alerta, .thesis p, .cond .muted, .how div, .field .hint, .msg, .empty-note, .banner,
.item .txt, .item .ans, .field textarea, .modal p, .g-col p, .step p, .concl p{ text-align:justify; text-justify:inter-word; hyphens:auto; -webkit-hyphens:auto; }
.item .txt, .item .ans{ display:block; }

/* visão geral */
.thesis{ border:2px solid var(--primary); background:#fff; }
.thesis p{ font-size:16.5px; font-weight:600; line-height:1.4; }
.cond-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
.cond{ display:flex; flex-direction:column; gap:10px; }
.cond .code{ font-family:var(--mono); font-size:12.5px; color:var(--primary); font-weight:600; }
.cond b{ font-size:15px; line-height:1.3; }
.seg{ display:flex; height:9px; border-radius:99px; overflow:hidden; background:var(--tint); }
.seg i{ display:block; height:100%; }
.seg .s-respondida{ background:var(--primary); } .seg .s-parcial{ background:var(--light); } .seg .s-derruba{ background:var(--alert-bg); }
.cond .meta{ font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
.cond .flag{ font-weight:600; }
.steps{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; counter-reset:s; }
.step{ position:relative; }
.step::before{ counter-increment:s; content:counter(s); font-family:var(--mono); font-weight:600; color:var(--primary); font-size:14px; }
.step b{ display:block; font-size:14.5px; margin:2px 0 4px; }
.step p{ font-size:13.5px; color:var(--muted); }
.hm-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:#fff; }
table.hm{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:760px; }
.hm th{ text-align:center; font-weight:700; padding:10px 8px; border-bottom:2px solid var(--primary); font-size:13px; }
.hm th:first-child{ text-align:left; padding-left:14px; }
.hm td{ padding:0; border-top:1px solid var(--line); text-align:center; }
.hm td:first-child{ text-align:left; padding:10px 14px; font-weight:600; }
.hm td button{ width:100%; height:100%; padding:10px 6px; border:none; cursor:pointer; font-family:var(--mono); font-size:12.5px; background:transparent; }
.hm td button:hover{ outline:2px solid var(--primary); outline-offset:-2px; }
.hm .bl td{ background:var(--tint); font-weight:700; font-size:12.5px; padding:6px 14px; text-align:left; }
.hm .na{ color:var(--muted); }
.how{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; font-size:14px; }
.how div b{ display:block; margin-bottom:2px; }
.recent li{ list-style:none; display:grid; grid-template-columns:70px minmax(0,1fr) auto; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:14px; align-items:center; }
.recent li:first-child{ border-top:none; }
.recent .c{ font-family:var(--mono); font-size:12.5px; color:var(--primary); font-weight:600; }
.recent button{ background:none; border:none; text-align:left; cursor:pointer; }

/* mapa competitivo */
.matrix-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:#fff; }
.matrix{ display:grid; grid-template-columns:170px repeat(5,minmax(160px,1fr)); min-width:980px; }
.mx-h{ padding:12px 14px; font-weight:700; font-size:14px; border-bottom:2px solid var(--primary); }
.mx-layer{ padding:14px; border-top:1px solid var(--line); background:var(--tint); }
.mx-layer b{ display:block; font-size:14px; } .mx-layer span{ font-size:12.5px; color:var(--muted); }
.mx-cell{ padding:12px 14px; border-top:1px solid var(--line); border-left:1px solid var(--line); font-size:13.5px; }
.mx-cell.span5{ grid-column:span 5; }
.mx-layer.l3{ background:var(--primary); color:#fff; } .mx-layer.l3 span{ color:#E3EEF8; }
details.ref{ margin-top:6px; } details.ref summary{ cursor:pointer; font-weight:600; font-size:14px; padding:6px 0; }

/* filtros */
.filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
.filters input[type=search]{ flex:1 1 240px; min-width:0; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff; }
.filters select{ padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff; font-size:13px; }
.fchip{ border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; color:var(--muted); }
.fchip[aria-pressed="true"]{ border-color:var(--primary); color:var(--primary); font-weight:600; }

/* tema */
.theme{ margin-top:28px; }
.theme-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
.theme-head h2 .tc{ font-family:var(--mono); font-size:14px; color:var(--primary); margin-right:8px; font-weight:600; }
.theme-desc{ color:var(--muted); font-size:14px; }
.alerta{ font-size:13px; margin-top:8px; padding:8px 12px; border-left:3px solid var(--primary); background:var(--tint); border-radius:0 var(--radius-sm) var(--radius-sm) 0; }
.concl{ margin-top:10px; border:1px solid var(--primary); background:#fff; border-radius:var(--radius-sm); padding:10px 14px; font-size:14px; }
.concl b{ font-size:12.5px; color:var(--primary); display:block; margin-bottom:2px; }
.btn-line{ border:1px dashed var(--primary); background:#fff; color:var(--primary); border-radius:999px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
.theme-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.roteiro{ margin-top:8px; font-size:13.5px; }
.roteiro summary{ cursor:pointer; font-weight:600; color:var(--primary); }
.roteiro pre{ white-space:pre-wrap; font-family:var(--sans); background:#fff; border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-top:6px; text-align:justify; }
.items{ display:grid; gap:8px; margin-top:12px; }
.item{ display:grid; grid-template-columns:62px minmax(0,1fr) auto; gap:14px; align-items:start; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px 16px; cursor:pointer; text-align:left; width:100%; }
.item:hover{ border-color:var(--light); }
.item.prov{ border-left:4px solid var(--primary); }
.item .code{ font-family:var(--mono); font-size:13px; font-weight:600; color:var(--primary); padding-top:1px; }
.item .txt{ font-weight:600; font-size:14.5px; line-height:1.4; }
.item .kind{ font-size:12px; color:var(--muted); font-weight:500; margin-right:6px; display:inline; }
.item .ans{ color:var(--muted); font-size:13.5px; margin-top:4px; }
.item .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; align-items:center; }
.tag{ font-size:11.5px; padding:2px 8px; border-radius:6px; background:var(--tint); color:var(--ink); }
.rgs{ display:inline-flex; gap:4px; margin-left:4px; }
.rg{ font-family:var(--mono); font-size:11px; font-weight:600; padding:2px 6px; border-radius:5px; border:1px solid var(--line); color:var(--muted); background:#fff; }
.rg.on{ background:var(--primary); border-color:var(--primary); color:#fff; }
.item .side{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.item .clip{ font-size:12px; color:var(--muted); font-family:var(--mono); }
.empty-note{ color:var(--muted); font-style:italic; font-size:14px; padding:10px 0; }

/* modal */
.overlay{ position:fixed; inset:0; background:rgba(20,53,96,.5); display:none; align-items:flex-start; justify-content:center; padding:max(16px, env(safe-area-inset-top,0px)) 12px 16px; z-index:50; overflow-y:auto; }
.overlay.open{ display:flex; }
.modal{ background:#fff; border-radius:18px; width:100%; max-width:1180px; padding:22px 24px; box-shadow:0 24px 60px -20px rgba(20,53,96,.45); }
.modal.narrow{ max-width:760px; }
.m-head{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:12px; }
.m-head .code{ font-family:var(--mono); color:var(--primary); font-weight:600; font-size:14px; }
.m-head h2{ font-size:18px; margin-top:2px; line-height:1.3; text-align:justify; }
.m-head .sub{ font-size:13px; color:var(--muted); }
.x{ background:var(--tint); border:none; border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:16px; flex:none; }
.guide{ display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:12px; margin-bottom:14px; }
.g-col{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; font-size:13.5px; }
.g-col h4{ color:var(--primary); }
.g-col p{ margin-bottom:8px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.field{ margin-bottom:12px; }
.field label, .field .lbl{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
.field .hint{ font-weight:400; color:var(--muted); }
.field textarea, .field input[type=text], .field input[type=url], .field select, .rc textarea, .rc input[type=text], .rc input[type=url], .rc select{ width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff; resize:vertical; }
.field textarea:focus, .field input:focus, .field select:focus, .rc textarea:focus, .rc input:focus, .rc select:focus{ outline:none; border-color:var(--primary); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.regions{ display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:12px; margin-bottom:14px; }
.rc{ border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; background:var(--card); display:flex; flex-direction:column; gap:8px; }
.rc.single{ grid-column:1/-1; }
.rc-h{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.rc-h b{ font-size:14.5px; } .rc-h select{ width:auto; font-size:12.5px; padding:4px 8px; }
.rc-act{ display:flex; gap:6px; flex-wrap:wrap; }
.linkrow{ display:grid; grid-template-columns:1fr 1.4fr auto; gap:6px; }
.linkrow[hidden]{ display:none; }
.checks{ display:flex; flex-wrap:wrap; gap:6px; }
.checks label{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer; margin:0; }
.checks input{ accent-color:var(--primary); }
.docs{ list-style:none; display:grid; gap:5px; }
.docs li{ display:flex; justify-content:space-between; gap:10px; align-items:center; padding:6px 9px; border:1px solid var(--line); border-radius:var(--radius-sm); font-size:13px; background:#fff; }
.docs a{ color:var(--primary); word-break:break-word; }
.docs .rm{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; text-decoration:underline; flex:none; }
.btn{ border:none; border-radius:999px; padding:9px 18px; font-weight:600; font-size:14px; cursor:pointer; }
.btn.sm{ padding:5px 12px; font-size:12.5px; }
.btn-p{ background:var(--primary); color:#fff; } .btn-p:disabled{ opacity:.5; cursor:default; }
.btn-g{ background:#fff; color:var(--ink); border:1px solid var(--line); display:inline-block; }
.btn-d{ background:none; color:var(--muted); text-decoration:underline; padding:9px 4px; }
.m-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); flex-wrap:wrap; }
.msg{ font-size:12.5px; color:var(--muted); }
.banner{ padding:12px 16px; border-radius:var(--radius-sm); background:var(--tint); font-size:14px; margin-bottom:18px; display:none; }
.banner.show{ display:block; }

/* tese */
.tese-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
.tese-grid .box h4{ color:var(--primary); font-size:14.5px; }
.tese-grid textarea{ width:100%; margin-top:6px; padding:8px 11px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff; resize:vertical; text-align:justify; }
.tese-grid label{ display:block; font-size:13px; font-weight:600; margin-top:10px; }
.tese-grid label:first-of-type{ margin-top:6px; }
.savebar{ display:flex; gap:12px; align-items:center; margin-top:16px; }

mark{ background:#FFE866; color:#143560; padding:0 2px; border-radius:3px; }
.hl-prev{ font-size:13px; text-align:justify; border:1px dashed var(--line); border-radius:8px; padding:8px 10px; background:#fff; white-space:pre-wrap; }
.hl-prev[hidden]{ display:none; }
.item .ans, .ref .ach{ white-space:pre-line; }
.confirm{ list-style:none; display:grid; gap:0; }
.confirm li{ display:grid; grid-template-columns:62px 110px minmax(0,1fr); gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px; align-items:start; }
.confirm li:first-child{ border-top:none; }
.confirm .cw{ color:var(--muted); font-size:12.5px; }
.confirm span:last-child{ text-align:justify; }
/* apresentação */
.startpt{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:0 0 12px; font-size:13.5px; }
.startpt b{ color:var(--primary); font-size:12.5px; } .startpt p{ margin-top:2px; text-align:justify; hyphens:auto; }
.m-tags{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px; }
details.plan{ margin-top:6px; font-size:13.5px; } details.plan summary{ cursor:pointer; color:var(--primary); font-weight:600; padding:6px 0; }
details.plan p{ color:var(--muted); text-align:justify; hyphens:auto; margin:4px 0 8px; }
/* revisão */
.rv{ font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap; display:inline-block; }
.rv-rascunho{ border:1.5px dashed var(--primary); color:var(--primary); background:#fff; }
.rv-aprovado{ background:var(--primary); color:#fff; border:1.5px solid var(--primary); }
.revbox li{ list-style:none; display:grid; grid-template-columns:70px minmax(0,1fr); gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:14px; align-items:center; }
.revbox li:first-child{ border-top:none; }
/* foco no Brasil */
.rc.main{ background:#fff; border:1.5px solid var(--primary); }
.others{ margin:0 0 14px; }
.others summary{ cursor:pointer; color:var(--primary); font-weight:600; font-size:13.5px; padding:6px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.others summary .muted{ font-weight:400; font-size:12.5px; }
.others .regions.sub{ margin-top:8px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
.others .rc{ background:var(--card); }
/* leitura e edição */
.rc[data-mode="view"] .edit-only, .vf[data-mode="view"] .edit-only{ display:none !important; }
.rc[data-mode="edit"] .view-only, .vf[data-mode="edit"] .view-only{ display:none !important; }
.rc-view, .vf-view{ font-size:14px; text-align:justify; text-justify:inter-word; hyphens:auto; white-space:pre-wrap; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
.rc-src{ font-size:12.5px; color:var(--muted); } .rc-src:empty{ display:none; }
.rc-tools{ display:flex; gap:10px; align-items:center; }
.edit-btn{ background:none; border:none; color:var(--primary); font-weight:600; font-size:13px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.vf-h{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:5px; } .vf-h label{ margin:0; }
.tag:empty{ display:none; }
/* oportunidades e desafios */
.mx5-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:#fff; padding:10px; }
.mx5{ display:grid; grid-template-columns:34px repeat(5,minmax(96px,1fr)); min-width:600px; }
.mx5-y, .mx5-x{ display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; color:var(--muted); }
.mx5-x{ padding-top:6px; }
.mx5-c{ min-height:74px; border:1px solid var(--line); padding:6px; display:flex; flex-wrap:wrap; gap:4px; align-content:flex-start; }
.mx5-c.qa{ background:rgba(0,106,181,.18); } .mx5-c.qb{ background:rgba(0,106,181,.09); } .mx5-c.qc{ background:rgba(71,158,219,.12); } .mx5-c.qd{ background:#fff; } .mx5-c.qm{ background:var(--card); }
.mk{ font-family:var(--mono); font-size:11.5px; font-weight:600; padding:3px 7px; border-radius:6px; cursor:pointer; }
.mk.oportunidade{ background:var(--primary); color:#fff; border:2px solid var(--primary); }
.mk.desafio{ background:#fff; color:var(--deep); border:2px dashed var(--deep); }
.mk:hover{ outline:2px solid var(--light); outline-offset:1px; }
.quad{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin-top:10px; }
.quad .box{ padding:12px 14px; font-size:13.5px; } .quad b{ display:block; } .quad .n{ font-family:var(--mono); font-size:18px; color:var(--primary); font-weight:600; }
.legend-mk{ display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:8px; align-items:center; }
.mcards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:12px; margin-top:12px; }
.mcard{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:8px; text-align:left; cursor:pointer; width:100%; }
.mcard:hover{ border-color:var(--light); }
.mcard.oportunidade{ border-left:4px solid var(--primary); } .mcard.desafio{ border-left:4px dashed var(--deep); } .mcard.insight{ border-left:4px solid var(--light); }
.mcard .mh{ display:flex; justify-content:space-between; gap:8px; align-items:center; }

function storyBar(cur){
  const ch=c=>`<button class="st-ch ${c.tab===cur?'on':''}" data-jump="${c.tab}" ${c.tab===cur?'aria-current="step"':''}><span class="mono">${String(c.n).padStart(2,'0')}</span>${esc(c.nome)}</button>`;
  return `<nav class="st-bar" aria-label="Capítulos da leitura">${STORY.map(ch).join('<span class="st-arr" aria-hidden="true">→</span>')}<span class="st-arr" aria-hidden="true">→</span><button class="st-ch ${cur==='appendix'?'on':''}" data-jump="appendix" ${cur==='appendix'?'aria-current="step"':''}><span class="mono">A</span>Hipóteses, premissas e referências</button></nav>`;
}
function storyHead(tab){
  const i=STORY.findIndex(c=>c.tab===tab), c=STORY[i], prev=STORY[i-1];
  return `${storyBar(tab)}<div class="sn-kick">Capítulo ${c.n} de ${STORY.length} · ${esc(c.nome)}</div>
   ${prev?`<p class="st-prev"><b>Do capítulo anterior.</b> ${esc(prev.r)} ${esc(prev.ponte)}</p>`:''}
   <p class="st-q"><b>Pergunta deste capítulo.</b> ${esc(c.q)}</p>`;
}
function storyEnd(tab,detalhe){
  const i=STORY.findIndex(c=>c.tab===tab), c=STORY[i], nx=STORY[i+1];
  const go=nx?`<button class="btn st-go" data-jump="${nx.tab}">Capítulo ${nx.n} · ${esc(nx.nome)} →</button>`:`<button class="btn st-go" data-jump="appendix">Appendix · hipóteses, premissas e referências →</button>`;
  return `<div class="st-end"><div class="sn-kick">Fim do capítulo ${c.n} · ${esc(c.nome)}</div>
   <p class="st-ans"><b>Resposta.</b> ${esc(c.r)}</p><p class="st-next"><b>A seguir.</b> ${esc(c.ponte)}</p>
   <div class="st-act">${go}<span class="muted sm">ou continue abaixo: ${detalhe}</span></div></div>`;
}

 {id:'m5', k:'05 · Varejo independente', short:'Varejo independente', pn:'indep', q:['PR3.1','Q3.1','Q3.2'], ins:[5],
  t:'O canal independente tem R$ 37,5 bilhões e cresce cada vez menos; os 94 mil CNPJs escondem uma cauda de MEI',
  p:['Os pet shops pequenos e médios foram de R$ 29,3 bilhões em 2022 a R$ 37,5 bilhões em 2025, com crescimento de 14,3%, 9,3% e 2,5% e projeção de 4% em 2026. O número de pontos depende do critério: 50.856 lojas (Abinpet e Instituto Pet Brasil, 2023) ou 94.363 CNPJs ativos (Leadjet, set/2026). Dos CNPJs, 57,9% são MEI, com teto de R$ 81 mil por ano e, no máximo, 12% da receita do canal; sem eles, são cerca de 39,7 mil, compatível com a contagem da Abinpet.',
     'A tendência é de perda gradual de participação, e não de encolhimento nominal. O segmento «pet shops e vet» do Pulso do Sebrae registrou queda de 8% do faturamento em ago/2025 contra ago/2024, o que combina com uma cauda de microempresas que encolhe enquanto as lojas maiores seguram o canal. Em 12 meses, 14,8% dos CNPJs foram abertos, e a mortalidade do setor em três anos é de 36,9% (Sebrae/PR).'],
  x:['O salto de 23,8% no número de lojas em 2023 (de 40.255 para 49.839) não é explicado na fonte e destoa do faturamento (+14%); não serve como prova de crescimento.','A conta de reconciliação: com 94 mil CNPJs, o faturamento médio seria de R$ 32 mil por mês; descontado o teto dos MEI, sobram cerca de R$ 68 mil por mês para os 39,7 mil restantes, dentro da faixa da Abinpet.','A Leadjet é fonte comercial, usa só o CNAE principal e não foi conferida com a base aberta da Receita Federal (divergência D7).'],
  refs:['R122','R123','R116','R121','R180','R186']},
 {id:'m6', k:'06 · Grandes redes', short:'Grandes redes', pn:'chains', q:['PR3.1','Q3.2','Q1.8'], ins:[6],
  t:'Petz e Cobasi crescem por loja madura e digital, e não por abertura: ganharam 0,85 ponto do setor em 2025, e a pressão é local',
  p:['Em 2025, as redes (lojas e online) passaram de 11,4% para 12,3% do setor, por estimativa. No 2T26, o Grupo Petz Cobasi teve receita bruta de R$ 2,108 bilhões (+7,8%), vendas em mesmas lojas de +7,1%, digital com 40,6% da receita e abertura líquida de apenas 9 lojas em 12 meses, com 520 lojas. O ganho vem de preço, sortimento, marca própria (14,4% na Petz e 9,5% na Cobasi) e conveniência.',
     'A participação de 40% atribuída ao grupo é local: o Cade apontou mais de 40% em 173 municípios (depois cerca de 100), e a média nacional é de 9% a 12%. Nos cenários ilustrativos para 2030, as redes chegam a 12,8%, 14,8% ou 17,8% do setor, e os pet shops crescem 4,9%, 3,4% ou 1,3% ao ano; em nenhum caso o canal encolhe em valor nominal, mas no cenário alto cresce abaixo da inflação.'],
  x:['A União Pet cortou em jan/2026 a estimativa de sinergias de R$ 330 milhões para R$ 200 a R$ 260 milhões de Ebitda em até cinco anos, e prevê captura de 0% a 10% em 2026.','47% das lojas da Petz e 58% das da Cobasi estão em São Paulo; o Cade exigiu a venda de 26 lojas no estado.','Os cenários dependem de três premissas (crescimento da categoria, das redes e parcela do ganho que sai dos pet shops); a de 60% é estimativa de um ano.'],
  refs:['R126','R127','R129','R131','R134','R224']},
 {id:'m7', k:'07 · Online', short:'Online', pn:'online', q:['Q3.5','Q5.2'], ins:[7],
  t:'No online, Petz Cobasi e Petlove somam cerca de 70% do e-commerce pet, e os pet shops pequenos recuam enquanto as lojas virtuais das mega stores crescem 29%',
  p:['O e-commerce pet foi de R$ 6,31 bilhões em 2025 (8,1% do setor): lojas virtuais das mega stores com R$ 2,07 bilhões (+29%), pet shops virtuais com R$ 2,34 bilhões (−2,5%) e lojas virtuais dos pet shops pequenos e médios com R$ 1,27 bilhão (−2%). O digital da Petz Cobasi foi de R$ 855,6 milhões no 2T26, e a Petlove faturou R$ 2,4 bilhões em 2025 (R$ 1,35 bilhão em 2023), com 79% do varejo por assinatura e a saúde em cerca de metade da empresa.',
     'Pela soma de faturamentos de fontes distintas, as duas redes somam cerca de 70% do e-commerce pet (estimativa), compatível com os 40% a 50% do Cade, que usa outro denominador. A ração online ainda é pequena: R$ 670 milhões em 2024 (Kantar), cerca de 5% do mercado de alimentação canina, mas com alta de 117% em dois anos. A vantagem das redes é desconto por recorrência, frete e escala, que o pequeno declara não ter.'],
  x:['A concentração de 70% mistura fontes e anos (digital da Petz Cobasi anualizado, receita da Petlove com saúde em metade); deve ser conferida em fonte única antes de ser usada como número.','A Kantar cita queda de 41% do volume nos pet shops independentes em 2024, número que não concilia com a alta de 9,3% em valor do canal (divergência D8).'],
  refs:['R124','R126','R190','R191','R144','R166']},
 {id:'m8', k:'08 · Super premium', short:'Super premium', pn:'sp', q:['Q3.6','Q9.2'], ins:[8],
  t:'Cerca de metade da super premium passa pelo pet shop independente, concentrada em poucas lojas: o canal importa mais do que a média sugere',
  p:['Não há dado público de venda por canal e por nível de preço. A estimativa de trabalho é de que a super premium seja de 10% a 25% do pet food (R$ 4,1 a R$ 10,4 bilhões) e de que 40% a 60% passe pelos pet shops pequenos e médios, o que dá de R$ 1,7 a R$ 6,2 bilhões por ano, com base de R$ 3,1 bilhões. A PremieRpet vende seus 380 SKUs só em pet shops e clínicas, e supermercados não carregam super premium.',
     'Duas checagens com os números da Farmina apontam para os cenários base e alto: R$ 280 milhões domésticos a preço de fábrica equivalem a R$ 420 a R$ 500 milhões a preço de varejo, o que daria à Farmina de 4% a 12% do segmento. E o cenário base dá cerca de R$ 78 mil por ano de super premium por CNPJ sem MEI, contra R$ 42 a R$ 50 mil da Farmina por ponto: os 10 mil pontos atendidos precisam estar entre os pet shops de maior venda do segmento.'],
  x:['A estimativa tem duas etapas hipotéticas; a divisão de canais da Abempet inclui serviços, medicamentos e acessórios.','O fator de varejo (1,5 a 1,8) e os R$ 400 milhões (que podem incluir exportação) são premissas.','O que mudaria a leitura: a Farmina vender mais de 50% do Brasil para contas-chave, ou uma fonte paga mostrar super premium abaixo de 10% do pet food.'],
  refs:['R176','R177','R178','R150','R155']},
 {id:'m9', k:'09 · Dores do pet shop', short:'Dores', pn:'pains', q:['Q3.5','Q3.3'], ins:[9],
  t:'A dor número um do pet shop é vender, e não o crédito: falta de clientes (35%) e custos (31%) pesam mais do que dívidas (18%)',
  p:['No Pulso dos Pequenos Negócios do Sebrae (ago/2025; 6.173 respondentes, 54% MEI), as maiores dificuldades são a falta de clientes (35%), o aumento de custos (31%) e as dívidas (18%). O faturamento médio caiu 7%, e 8% em «pet shops e vet». O crédito melhorou (aprovação de crédito novo de 48% em 2025), mas o juro médio do crédito livre para empresas é de 25,2% ao ano, e 21% dos pequenos negócios estão com dívida em atraso.',
     'As entidades do setor acrescentam a tributação de cerca de 50% no pet food, a escassez de banhistas formais, a falta de escala digital e de logística dos pequenos e a vantagem das grandes redes na negociação com a indústria; uma central de compras do Sindilojas-SP deu pouco resultado. Ruptura não tem dado público, mas a loja de vizinhança cobre só cerca de 30% do mix, contra 90% nas mega stores nacionais.'],
  x:['Não há pesquisa pública de dores específica de pet shops: o diagnóstico mistura o Sebrae (pequenos negócios, com recorte de pet), declarações de entidades e um estudo regional.','O recorte «pet shops e vet» vem de um gráfico sem amostra informada.'],
  refs:['R180','R182','R189','R186','R150']},
 {id:'m10', k:'10 · Capital e M&A', short:'Capital e M&A', pn:'capital', q:['Q7.1','Q7.2','Q7.3'], ins:[10],
  t:'O capital compra relacionamento com o tutor e o veterinário, e não marcas de ração: 98% do que foi divulgado é private equity e capital de crescimento',
  p:['De 2023 a 2026, as aquisições relevantes no Brasil estão na camada 3 (varejo, saúde e software): Petz e Cobasi, Petlove com Provet e SimplesVet, Mars com a PetCare, L Catterton com a WeVets, WeVets com a Animaniacs, +Pet com a VFP. Na indústria não há consolidação: a BRF Pet tentou vender a divisão (28/02 a 13/11/2023) e a ADM saiu (2025). Dos cerca de R$ 1,57 bilhão de aportes divulgados de 2020 a 2025, 98% são de private equity e capital de crescimento, e a Petlove sozinha é 71%.',
     'Há um fundo (Kinea) dentro do acionista de referência da União Pet. As redes de hospitais têm de 15 a 20 unidades e avaliação de R$ 400 a R$ 415 milhões, contra mais de 2.500 clínicas da IVC Evidensia, e na América Latina fora do Brasil o capital vem de family offices. O venture inicial é quase inexistente em valor, e o capital global em pet teve em 2025 o ano mais fraco da década (US$ 899,5 milhões em 262 negócios).'],
  x:['A lista vem de imprensa e de comunicados; muitos valores não são públicos, e não há base paga de transações.','A extensão da saída da TreeCorp na WeVets não está clara (divergência D12): os coinvestidores tiveram retornos de 1,7 e 2,7 vezes.','O total divulgado exclui aquisições e rodadas sem valor.'],
  refs:['R246','R252','R198','R247','R231','R220']},
 {id:'m11', k:'11 · Fundos corporativos', short:'Fundos corporativos', pn:'cvc', q:['Q7.4','Q8.1'], ins:[11],
  t:'Mars, Purina e General Mills usam três desenhos de corporate venture; a Purina já acelera pet techs no Brasil, e o GB Ventures é o gabarito local',
  p:['A Mars Petcare mantém um fundo de US$ 100 milhões (Companion Fund, gerido com a Digitalis) e uma aceleradora (Leap, US$ 200 mil por startup, 57 empresas em 17 mercados). A Nestlé Purina tem só aceleradora, sem equity (Unleashed, até € 52 mil por projeto em 20 semanas), e já selecionou três startups brasileiras, a última delas, em 2026, a SistemaPet, um SaaS de gestão para pet shops e clínicas. A General Mills tem três pilares (estúdio, CVC e growth equity) que levam da startup à compra.',
     'No Brasil, o gabarito de corporate venture é o GB Ventures, do Grupo Boticário: aceleração sem equity desde 2021 e fundo de R$ 100 milhões em quatro anos, com cheques de US$ 1 a 2 milhões, de 8 a 12 startups e equipe de 13 pessoas, mas com uma única startup no portfólio no lançamento. Não localizei fundo ou aceleradora de fabricante brasileiro de pet food nem da Farmina, nem fundo dedicado a pet na América Latina.'],
  x:['Fundos dedicados a pet no mundo são pequenos (US$ 10 a 25 milhões): Ani.VC, Pawsible, Leap e Elanco Ventures; os de maior alcance são corporativos.','Não foi verificado se o Leap ou o Companion Fund investem no Brasil.'],
  refs:['R259','R264','R265','R267','R268']},
 {id:'m11b', k:'12 · Universidades e centros de pesquisa', short:'Pesquisa', pn:'uni', q:['Q8.4','Q6.5'], ins:[12],
  t:'A pesquisa em nutrição de cães e gatos do Brasil está em dois centros paulistas apoiados pela indústria local, e a Farmina chega com base científica italiana',
  p:['Os centros brasileiros de nutrição de cães e gatos que localizei ficam no interior de São Paulo: o CEPEN Pet (Centro de Pesquisas em Nutrologia de Cães e Gatos), da FMVZ/USP em Pirassununga, e o Laboratório de Pesquisa em Nutrição e Doenças Nutricionais de Cães e Gatos da FCAV/UNESP em Jaboticabal, que tem fábrica de ração da universidade e salas de digestibilidade. A indústria já financia os dois: a PremieRpet investe no CEPEN e mantém um prêmio de pesquisa (9ª edição em 2022), e teses de Jaboticabal agradecem ao apoio de Guabi, Premier Pet e Affinity. Há também o serviço de nutrologia veterinária do hospital da FMVZ/USP, em São Paulo, e especialistas formados na UFMG e na UFLA.',
     'A Farmina tem base científica própria, mas italiana: o Farmina Vet Research nasceu em 1999 da parceria com a Cátedra de Nutrição Animal da Universidade de Nápoles Federico II, e a empresa diz fazer estudos em lares reais com universidades no mundo. Não localizei parceria da Farmina com universidade brasileira. Quanto a startups, não há lista pública de pet techs nascidas em universidades; o único caso verificado é uma startup de petiscos naturais com fábrica no parque tecnológico da UFV (Centev), e ONVET, Petgenoma e Feragen não têm origem acadêmica verificada.'],
  x:['Não consultei o Diretório de Grupos de Pesquisa do CNPq nem as agências de inovação das universidades; o mapa é de imprensa, teses e comunicados.','A data de inauguração do CEPEN não foi capturada, e o nome da startup do Centev também não.','O estudo premiado de IA e microbiota fecal em cães com doença inflamatória intestinal mostra o tipo de pesquisa próxima da nutrição de precisão (hipótese H2).'],
  refs:['R297','R298','R299','R300','R301']},
 {id:'m12', k:'13 · Regras e dados que não fecham', short:'Regras e divergências', pn:'regs', q:['Q10.3','Q10.5'], ins:[],
  t:'O gargalo regulatório é de tributo e de registro, e não de acesso; seis divergências de dado ainda impedem números únicos',
  p:['O alimento completo é isento de registro de produto, e o terapêutico (coadjuvante) exige registro com ensaios clínicos, mas nenhum dos dois exige receita para a venda. Rótulo e propaganda devem trazer informação correta, clara e precisa (IN 22/2009), e a imagem que sugira ingrediente exige a menção «imagem meramente ilustrativa» quando houver subproduto. No antitruste, o Cade impôs a venda de 26 lojas na fusão Petz Cobasi e acompanha o cumprimento.',
     'Seis divergências de fonte seguem abertas e precisam de resolução: a participação da Petz Cobasi (40% local contra menos de 10% nacional), o número de pet shops (50,9 mil contra 94,4 mil), o volume da Kantar (+10,4% e −41%, contra produção −0,6%), o desenho da saída da WeVets, as datas da fusão e o significado do «30%» da Farmina.'],
  x:['Tarifas e barreiras de importação (Q10.1) e telemedicina veterinária (Q10.4) ainda não foram respondidas.','Falta a norma do conselho veterinário sobre prescrição de dietas para fechar a Q10.3.'],
  refs:['R160','R161','R167','R129','R130']},
 {id:'m13', k:'14 · O que o mercado diz sobre a tese', short:'Síntese', pn:'verdict', q:['PR3.1','Q3.6','Q7.3'], ins:[],
  t:'O mercado sustenta o espaço para o canal independente (C1), mas pede foco nas lojas maiores, nos serviços e no digital, e não nos 94 mil CNPJs',
  p:['A condição C1 se sustenta em tamanho (R$ 37,5 a R$ 38,8 bilhões e cerca de metade da super premium) e com resiliência moderada: perda de 0,3 a 0,4 ponto por ano, pressão concentrada em São Paulo, nas capitais e no online, e dor central de vender, e não de crédito. As condições C2 e C3 dependem de regras de preço e de neutralidade perante distribuidores e redes, e de uma margem do pet shop que as taxas de marketplace comem de 43% a 62%.',
     'Quatro lacunas limitam a certeza: a divisão atual por nível de preço e por canal, o tamanho do terapêutico, a concentração online em fonte única e uma base paga de capital. Elas estão na lista de dados a validar, e as três primeiras só se fecham com dado da Farmina ou de uma fonte paga.'],
  x:['A leitura de C1 usa o Market; a de C2, C3 e C4 depende também das abas B2B, B2C e Farmina.'],
  refs:[]},
];

function mkCols(rows,o){
  const W=560,H=o.h||230,bx=40,n=rows.length,gap=16,bw=Math.floor((W-bx-10-gap*(n-1))/n),base=H-44,ch=H-90,mx=o.max;

  rows.forEach((r,i)=>{ const x=bx+i*(bw+gap), h=r.v/mx*ch, c=r.dash?'#C5CED9':(r.hi?MKC.deep:MKC.pri);
    s+=`<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="3" fill="${c}"${r.dash?` stroke="${MKC.pri}" stroke-dasharray="4 3"`:''}/><text x="${x+bw/2}" y="${base-h-18}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${MKC.deep}">${r.l}</text><text x="${x+bw/2}" y="${base-h-5}" text-anchor="middle" font-size="11" fill="#4A5F7A">${r.g||''}</text><text x="${x+bw/2}" y="${base+17}" text-anchor="middle" font-size="12" fill="#4A5F7A">${r.x}</text>`; });
  return s+`<text x="${W-6}" y="14" text-anchor="end" font-size="11.5" fill="#4A5F7A">${o.unit}</text></svg>`;

function mkBars(rows,o){

}
function mkStack(rows,o){
  const W=560; let s=`<svg viewBox="0 0 ${W} ${o.h}" role="img" aria-label="${o.aria}" class="sn-svg">`;
  rows.forEach((r,ri)=>{ const y=ri*o.rh+6; let x=o.L; s+=`<text x="0" y="${y+22}" font-size="12.2" fill="${MKC.deep}">${r.n}</text>`;

  return s+`</svg>`;
}

function mkSetActive(id){
  const st=MK_STEPS.find(s=>s.id===id); if(!st) return; MK.active=id; const i=MK_STEPS.indexOf(st), root=document.getElementById('panel-market'); if(!root) return;
  root.querySelectorAll('.sn-step').forEach(e=>e.classList.toggle('cur',e.dataset.mkstep===id));
  root.querySelectorAll('.sn-pn').forEach(e=>e.classList.toggle('on',e.dataset.mkpn===id));
  root.querySelectorAll('.sn-dots-nav button').forEach(e=>e.classList.toggle('on',e.dataset.mkStepGo===id));
  const n=root.querySelector('[data-mk-hn]'), t=root.querySelector('[data-mk-ht]'), p=root.querySelector('[data-mk-prog]'), s=root.querySelector('[data-mk-src]');
  if(n) n.textContent=String(i+1).padStart(2,'0')+'/'+MK_STEPS.length; if(t) t.textContent=st.short; if(p) p.style.width=((i+1)/MK_STEPS.length*100)+'%'; if(s) s.innerHTML=mkSrcs(st); pagerSync('mk');
}
function mkPick(){
  const panel=document.getElementById('panel-market'); if(!panel||!panel.classList.contains('active')) return;
  const steps=[...panel.querySelectorAll('.sn-step')]; if(!steps.length) return;
  const line=window.innerHeight*0.42; let best=null, bd=1e9;
  steps.forEach(st=>{ const r=(st.querySelector('.sn-body')||st).getBoundingClientRect(); const d=(line>=r.top&&line<=r.bottom)?0:Math.min(Math.abs(r.top-line),Math.abs(r.bottom-line)); if(d<bd){ bd=d; best=st; } });
  if(best&&(best.dataset.mkstep!==MK.active||!panel.querySelector('.sn-pn.on'))) mkSetActive(best.dataset.mkstep);
}
function mkOnScroll(){ if(MK_RAF) return; MK_RAF=requestAnimationFrame(()=>{ MK_RAF=0; mkPick(); }); }
function mkInit(){
  const root=document.getElementById('panel-market'); if(!root) return; const steps=[...root.querySelectorAll('.sn-step')]; if(!steps.length) return;
  mkSetActive(MK.active||steps[0].dataset.mkstep);
  if(!MK_BOUND){ window.addEventListener('scroll',mkOnScroll,{passive:true}); window.addEventListener('resize',mkOnScroll); MK_BOUND=true; }
  mkPick();
}
document.addEventListener('click',e=>{

const chPt=(t,s)=>`<div class="sn-pt"><b>${t}</b>${s?`<span>${s}</span>`:''}</div>`;

const CHC={deep:'#143560',pri:'#006AB5',mid:'#479EDB',grey:'#8A97A8',lt:'#C5CED9',tint:'#E3EEF8'};
function chCols(rows,o){
  const W=560,H=o.h||230,bx=40,n=rows.length,gap=16,bw=Math.floor((W-bx-10-gap*(n-1))/n),base=H-44,ch=H-90,mx=o.max;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}" class="sn-svg"><line x1="30" y1="${base}" x2="${W-6}" y2="${base}" stroke="#D3E1EF"/>`;
  rows.forEach((r,i)=>{ const x=bx+i*(bw+gap), h=r.v/mx*ch, c=r.dash?'#C5CED9':(r.hi?CHC.deep:CHC.pri);
    s+=`<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="3" fill="${c}"${r.dash?` stroke="${CHC.pri}" stroke-dasharray="4 3"`:''}/><text x="${x+bw/2}" y="${base-h-18}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${CHC.deep}">${r.l}</text><text x="${x+bw/2}" y="${base-h-5}" text-anchor="middle" font-size="11" fill="#4A5F7A">${r.g||''}</text><text x="${x+bw/2}" y="${base+17}" text-anchor="middle" font-size="12" fill="#4A5F7A">${r.x}</text>`; });
  return s+`<text x="${W-6}" y="14" text-anchor="end" font-size="11.5" fill="#4A5F7A">${o.unit}</text></svg>`;
}
function chBars(rows,o){
  const W=560,L=o.L||170,rh=o.rh||30,H=rows.length*rh+10,mx=o.max;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}" class="sn-svg">`;
  rows.forEach((r,i)=>{ const y=i*rh+4, w=Math.max(2,r.v/mx*(W-L-70)), c=r.c||CHC.pri;
    s+=`<text x="0" y="${y+17}" font-size="12.2" fill="${CHC.deep}">${r.n}</text><rect x="${L}" y="${y+4}" width="${w}" height="${rh-12}" rx="3" fill="${c}"${r.dash?` fill-opacity=".25" stroke="${CHC.pri}" stroke-dasharray="4 3"`:''}/><text x="${L+w+6}" y="${y+17}" font-size="12.2" font-weight="700" fill="${CHC.deep}">${r.t}</text>`; });
  return s+`</svg>`;
}
function chStack(rows,o){
  const W=560; let s=`<svg viewBox="0 0 ${W} ${o.h}" role="img" aria-label="${o.aria}" class="sn-svg">`;
  rows.forEach((r,ri)=>{ const y=ri*o.rh+6; let x=o.L; s+=`<text x="0" y="${y+22}" font-size="12.2" fill="${CHC.deep}">${r.n}</text>`;
    r.s.forEach(([v,c,t,dk])=>{ const w=v/100*(W-o.L-6); s+=`<rect x="${x}" y="${y+4}" width="${w}" height="24" fill="${c}"/>`; if(w>26) s+=`<text x="${x+w/2}" y="${y+21}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${dk?CHC.deep:'#fff'}">${t}</text>`; x+=w; }); });
  return s+`</svg>`;
}

function chSetActive(id){
  const st=CH_STEPS.find(s=>s.id===id); if(!st) return; CH.active=id; const i=CH_STEPS.indexOf(st), root=document.getElementById('panel-channels'); if(!root) return;
  root.querySelectorAll('.sn-step').forEach(e=>e.classList.toggle('cur',e.dataset.chstep===id));
  root.querySelectorAll('.sn-pn').forEach(e=>e.classList.toggle('on',e.dataset.chpn===id));
  root.querySelectorAll('.sn-dots-nav button').forEach(e=>e.classList.toggle('on',e.dataset.chStepGo===id));
  const n=root.querySelector('[data-ch-hn]'), t=root.querySelector('[data-ch-ht]'), p=root.querySelector('[data-ch-prog]'), s=root.querySelector('[data-ch-src]');
  if(n) n.textContent=String(i+1).padStart(2,'0')+'/'+CH_STEPS.length; if(t) t.textContent=st.short; if(p) p.style.width=((i+1)/CH_STEPS.length*100)+'%'; if(s) s.innerHTML=chSrcs(st); pagerSync('ch');
}
function chPick(){
  const panel=document.getElementById('panel-channels'); if(!panel||!panel.classList.contains('active')) return;
  const steps=[...panel.querySelectorAll('.sn-step')]; if(!steps.length) return;
  const line=window.innerHeight*0.42; let best=null, bd=1e9;
  steps.forEach(st=>{ const r=(st.querySelector('.sn-body')||st).getBoundingClientRect(); const d=(line>=r.top&&line<=r.bottom)?0:Math.min(Math.abs(r.top-line),Math.abs(r.bottom-line)); if(d<bd){ bd=d; best=st; } });
  if(best&&(best.dataset.chstep!==CH.active||!panel.querySelector('.sn-pn.on'))) chSetActive(best.dataset.chstep);
}
function chOnScroll(){ if(CH_RAF) return; CH_RAF=requestAnimationFrame(()=>{ CH_RAF=0; chPick(); }); }

  if(!CH_BOUND){ window.addEventListener('scroll',chOnScroll,{passive:true}); window.addEventListener('resize',chOnScroll); CH_BOUND=true; }

}

function fdMainRows(){ return FD_ROWS.map(r=>{ const d=fdDoc(r[0]); return [r[0],FD_BLOCOS[r[1]],r[2],r[3],r[4],r[5],r[6]+(r[7]?' · '+r[7]:''),d.valor||'',d.periodo||'',d.resp||'',(FD_STATUS.find(s=>s[0]===fdStatus(r[0]))||[0,'Pendente'])[1],d.obs||'']; }); }
function fdAnnexRows(key,h,n){ const a=fdAnnex(key); const rows=[]; for(let i=0;i<n;i++){ const r=(a.rows[i]||[]).slice(); const row=h.map((_,j)=>j===0?(i+1):(r[j]??'')); rows.push(row); } return rows; }
function fdCsv(){ const q=v=>{ const s=String(v??''); return /[";\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }; return '\ufeff'+[FD_MAIN_H].concat(fdMainRows()).map(r=>r.map(q).join(';')).join('\r\n'); }
function fdLoadXlsx(){ return new Promise((ok,no)=>{ if(window.XLSX) return ok(window.XLSX); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>window.XLSX?ok(window.XLSX):no(new Error('xlsx')); s.onerror=()=>no(new Error('xlsx')); document.head.appendChild(s); }); }
async function fdSave(filename,data){

}

/* ---- importação ---- */
function fdParseCsv(text){
  text=String(text||'').replace(/^\ufeff/,''); const first=text.split(/\r?\n/)[0]||''; const d=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===d){ row.push(cell); cell=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); } return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function fdReadMain(aoa){
  const h=(aoa[0]||[]).map(fdNorm), ix=k=>h.findIndex(x=>x.startsWith(k)), c={id:ix('id'),valor:ix('valor'),per:ix('periodo'),resp:ix('responsavel'),st:ix('status'),obs:ix('observ')}; const out={}; let n=0;
  if(c.id<0||c.valor<0) return {out,n,erro:'Colunas ID e VALOR FARMINA não encontradas na aba «Dados».'};
  aoa.slice(1).forEach(r=>{ const id=String(r[c.id]||'').trim().toUpperCase(); if(!FD_ROWS.some(x=>x[0]===id)) return; const get=i=>i<0?'':String(r[i]??'').trim(); const valor=get(c.valor), obs=get(c.obs), per=get(c.per), resp=get(c.resp); let st=fdNorm(get(c.st)); st=['pendente','preenchido','confirmado'].includes(st)?st:''; if(!valor&&!obs&&!per&&!resp&&(!st||st==='pendente')) return; out[id]={valor,periodo:per,resp,obs,status:valor?(st==='confirmado'?'confirmado':'preenchido'):(st||'pendente')}; n++; });
  return {out,n};
}
async function fdImport(file){
  const msg=document.getElementById('fd-msg'); const set=t=>{ if(msg) msg.textContent=t; };
  if(!DB||!READY){ set('O banco não está disponível para gravar.'); return; }
  try{
    let main=null, dist=null, cont=null;
    if(/\.xlsx$/i.test(file.name)){ const X=await fdLoadXlsx(), wb=X.read(await file.arrayBuffer(),{type:'array'}); const sh=n=>{ const k=wb.SheetNames.find(s=>fdNorm(s)===fdNorm(n)); return k?X.utils.sheet_to_json(wb.Sheets[k],{header:1,defval:''}):null; }; main=sh('Dados'); dist=sh('Distribuidores'); cont=sh('Grandes contas'); }
    else main=fdParseCsv(await file.text());
    if(!main){ set('Aba «Dados» não encontrada no arquivo.'); return; }
    const m=fdReadMain(main); if(m.erro){ set(m.erro); return; }
    const now=new Date().toISOString(), jobs=[];
    Object.entries(m.out).forEach(([id,v])=>jobs.push(DB.doc('dadosfarmina/'+id).set({...v,origem:'Farmina (arquivo importado)',updatedAt:now})));
    const ann=(aoa,key,h)=>{ if(!aoa||aoa.length<2) return 0; const rows=aoa.slice(1).map(r=>h.map((_,j)=>String(r[j]??'').trim())); const c=rows.filter(r=>r.slice(1).some(x=>x!=='')).length; if(c) jobs.push(DB.doc('dadosfarmina/'+key).set({headers:h,rows,updatedAt:now})); return c; };
    const nd=ann(dist,'anexo_dist',FD_DIST_H), nc=ann(cont,'anexo_contas',FD_CONT_H);
    jobs.push(DB.doc('dadosfarmina/_meta').set({importedAt:now,fileName:file.name,dados:m.n,distribuidores:nd,contas:nc}));
    await Promise.all(jobs);
    set(`Importado: ${m.n} dados, ${nd} distribuidores e ${nc} grandes contas.`);
  }catch(e){ set('Não foi possível ler o arquivo. Use o modelo exportado, em Excel ou CSV.'); }
}

let DB=null, ASSETS=null, READY=false;
let RESP={}, TEMAS={}, TESE={}, REFS={}, MAPA={}, PREM={};
const FM={ q:'', tipo:'', tese:'', terr:'', fase:'', status:'' };
let EDITMAPA=null;
const FR={ q:'', terr:'', tipo:'', conf:'', ver:'' };
let EDITREF=null;
const F={ q:'', st:'todos', reg:'', rev:'' };
let EDIT=null, ORIG=null, EDITTHEME=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/==([\s\S]+?)==/g,'<mark>$1</mark>').replace(/==/g,'');
const cut=(s,n)=>{ s=String(s||''); if(s.length<=n) return s; let t=s.slice(0,n); if((t.match(/==/g)||[]).length%2) t+='=='; return t+'…'; };
const clone=o=>JSON.parse(JSON.stringify(o??{}));
const chip=s=>`<span class="st st-${s}">${STATUS[s]||s}</span>`;
const R=code=>RESP[code]||{};
const CATIDX=Object.fromEntries(CAT.map(i=>[i.code,i]));
const pkOf=it=>it&&it.esc==='g'?'gl':'br';
const val=(code,k)=>(R(code).regioes||{})[k]||{};
const filled=(code,k)=>!!String(val(code,k).texto||'').trim();
function statusOf(code){
  const r=R(code), s=r.status;
  if(s==='preenchido'||s==='respondida'||s==='parcial'||s==='derruba') return 'preenchido';
  if(s==='naopreenchido') return 'naopreenchido';
  const pk=pkOf(CATIDX[code]||{esc:r.esc});
  return String(((r.regioes||{})[pk]||{}).texto||'').trim()?'preenchido':'naopreenchido';
}
const keysOf=it=>it.esc==='g'?['gl']:REG.map(r=>r[0]);
const labelOf=k=>k==='gl'?'Resposta':REG.find(r=>r[0]===k)[1];
const kindName=t=>t==='p'?'Provocação':t==='x'?'Pendência':'Pergunta';

function allItems(){
  const extra=Object.values(RESP).filter(r=>r.custom).map(r=>({code:r.code,tema:r.tema,tipo:r.tipo||'q',esc:r.esc||'r',texto:r.texto||'',conds:r.conds||[],fazer:'',fontes:[],herd:'',custom:true}));
  return CAT.concat(extra);
}
const itemsOf=t=>allItems().filter(i=>i.tema===t);
const getItem=code=>allItems().find(i=>i.code===code);
function deepMerge(a,b){ const o=Array.isArray(a)?[...a]:{...a}; for(const k in b){ const v=b[k]; o[k]=(v&&typeof v==='object'&&!Array.isArray(v))?deepMerge(o[k]||{},v):v; } return o; }

const revOf=i=>((R(i.code).regioes||{})[pkOf(i)]||{}).revisao||'';
const matches=i=>{
  if(F.rev&&revOf(i)!==F.rev) return false;
  if(F.st!=='todos'&&statusOf(i.code)!==F.st) return false;
  if(F.reg&&!(keysOf(i).includes(F.reg)&&!filled(i.code,F.reg))) return false;
  if(!F.q) return true;
  const q=F.q.toLowerCase(), r=R(i.code);
  const regTxt=Object.values(r.regioes||{}).map(x=>(x.texto||'')+' '+(x.fontes||'')).join(' ');
  return [i.code,i.texto,r.consolidado,r.notas,regTxt].some(v=>String(v||'').toLowerCase().includes(q));
};

function renderTabs(){
  const cur=curTab();
  tabsEl.innerHTML=TABS.filter(t=>!t.hidden).map(t=>`<button class="tab-btn" role="tab" id="tab-${t.id}" aria-controls="panel-${t.id}" aria-selected="${t.id===cur}" data-tab="${t.id}">${t.n}<span class="n" data-n="${t.id}"></span></button>`).join('');

function segBar(list){
  const tot=list.length||1, c=s=>list.filter(i=>statusOf(i.code)===s).length;
  return `<div class="seg" aria-hidden="true"><i class="s-respondida" style="width:${c('preenchido')/tot*100}%"></i></div>`;
}
function condCard(key,obj){
  const list=allItems().filter(i=>i.tipo!=='x'&&(i.conds||[]).includes(key));
  const resp=list.filter(i=>statusOf(i.code)==='preenchido').length;
  const label=/^C\d/.test(key)?'Condição '+key.slice(1):'Tese candidata';
  return `<div class="box cond"><span class="code">${label}</span><b>${obj.n}</b><span class="muted" style="font-size:13.5px">${obj.d}</span>${segBar(list)}<div class="meta"><span>${resp} de ${list.length} preenchidas</span></div></div>`;
}
function heatRow(t){
  const items=itemsOf(t.id).filter(i=>i.tipo==='q'||i.tipo==='x');
  const cell=(kind)=>{
    const rel=items.filter(i=>kind==='gl'?i.esc==='g':i.esc==='r');
    if(!rel.length) return `<td class="na">—</td>`;
    const f=rel.filter(i=>filled(i.code,kind==='gl'?'gl':'br')).length, ratio=f/rel.length;
    return `<td style="background:rgba(0,106,181,${(0.05+ratio*0.38).toFixed(2)})"><button data-jump="${t.tab}" data-theme="${t.id}" aria-label="${esc(t.n)}, ${kind==='gl'?'itens globais':'Brasil'}: ${f} de ${rel.length}">${f}/${rel.length}</button></td>`;
  };
  const others=items.filter(i=>['la','us','eu','cn'].some(k=>filled(i.code,k))).length;
  return `<tr><td>${esc(t.n)}</td>${cell('br')}${cell('gl')}<td style="${others?'background:rgba(71,158,219,.22)':''}" class="${others?'':'na'}">${others||'—'}</td></tr>`;
}

function rgChips(i){
  if(i.esc==='g') return '';
  const others=REG.filter(r=>r[0]!=='br'&&filled(i.code,r[0]));
  return `<span class="rgs" aria-label="Territórios preenchidos"><span class="rg ${filled(i.code,'br')?'on':''}">BR</span>${others.map(r=>`<span class="rg on">${r[2]}</span>`).join('')}</span>`;
}
const refsFor=code=>Object.values(REFS).filter(r=>(r.perguntas||[]).includes(code));
function docCount(i){ const r=R(i.code); return Object.values(r.regioes||{}).reduce((n,x)=>n+((x.docs||[]).length),0); }
function firstAnswer(i){ for(const k of keysOf(i)){ const t=val(i.code,k).texto; if(t) return (k==='gl'||k==='br'?'':labelOf(k)+': ')+t; } return ''; }
function itemCard(i){
  const docs=docCount(i), a=firstAnswer(i);
  return `<button class="item ${i.tipo==='p'?'prov':''}" data-open="${esc(i.code)}">
    <span class="code">${esc(i.code)}</span>
    <span><span class="txt"><span class="kind">${kindName(i.tipo)}</span>${esc(i.texto)}</span>${a?`<span class="ans">${fmt(cut(a,320))}</span>`:''}
      <span class="tags">${(i.conds||[]).map(c=>`<span class="tag">${TAGNAME[c]||c}</span>`).join('')}${R(i.code).notas?'<span class="tag">Para validar</span>':''}${revOf(i)?`<span class="rv rv-${revOf(i)}">${revOf(i)==='rascunho'?'Em revisão':'Validado'}</span>`:''}${rgChips(i)}</span></span>
    <span class="side">${chip(statusOf(i.code))}${docs?`<span class="clip">📎 ${docs}</span>`:''}${refsFor(i.code).length?`<span class="clip">📚 ${refsFor(i.code).length}</span>`:''}</span></button>`;
}
function themeBlock(t){

  return `<section class="theme" id="th-${t.id}">
    <div class="theme-head"><div><h2><span class="tc">${t.id}</span>${esc(t.n)}</h2><p class="theme-desc">${esc(t.d)}</p></div>

}

function confirmItems(){
  const out=[];
  Object.values(RESP).forEach(r=>{
    if(!getItem(r.code)) return;
    const push=(where,text)=>{ (String(text||'').match(/==([\s\S]+?)==/g)||[]).forEach(m=>out.push({code:r.code,where,txt:m.slice(2,-2).trim()})); };
    Object.entries(r.regioes||{}).forEach(([k,v])=>push(labelOf(k),v.texto));
    push('Benchmarking',r.consolidado); push('Para validação',r.notas);
  });
  return out;
}

function gxApply(id){
  const el=gxEl(id), g=GXS[id]; if(!el) return; const s=String(g.step);
  el.dataset.step=s; el.classList.toggle('dim',s!=='0');
  el.querySelectorAll('.gx-d').forEach(n=>n.classList.toggle('on',s==='0'||(n.dataset.s||'').split(' ').includes(s)));

function gxStop(id){ const g=GXS[id]; if(g&&g.timer){ clearInterval(g.timer); g.timer=null; } }
function gxPlay(id){ const g=GXS[id], n=g.steps.length-1; gxStop(id); g.played=true; g.step=1; gxApply(id); g.timer=setInterval(()=>{ g.step=g.step>=n?0:g.step+1; gxApply(id); if(g.step===0) gxStop(id); },3200); }
function gxInit(){ Object.keys(GXS).forEach(id=>{ const el=gxEl(id), g=GXS[id]; if(!el) return; gxApply(id); if(g.played||!('IntersectionObserver' in window)) return; if(g.io) g.io.disconnect(); g.io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)&&!g.played){ g.io.disconnect(); gxPlay(id); } },{threshold:.6}); g.io.observe(el); }); }

function dpInit(){

    const p=document.getElementById(pid); if(!p||p.querySelector('.dp')) return;
    const story=p.querySelector('section.sn-story'); if(!story) return;
    const secs=[]; let n=story.nextElementSibling; while(n){ if(n.matches&&n.matches('section.sn-sec')) secs.push(n); n=n.nextElementSibling; }
    if(!secs.length) return;

    wrap.innerHTML=`<div class="dp-bar" role="group" aria-label="Aprofundar o capítulo"><span class="dp-t">Aprofundar</span>${secs.map(s=>{ const k=DP_LBL[s.id.replace(/^[a-z]+-/,'')]||s.id, c=DP_CNT[s.id]; return `<button type="button" class="dp-tag" data-dp="${s.id}" aria-expanded="false" aria-controls="${s.id}">${k}${c?`<span class="dp-n">${c()}</span>`:''}<span class="dp-pm" aria-hidden="true">+</span></button>`; }).join('')}</div><div class="dp-body"></div>`;

  return `<div class="field vf" data-vf="${key}" data-mode="${has?'view':'edit'}"><div class="vf-h"><label for="${id}">${label} <span class="hint">${hint}</span></label><button type="button" class="edit-btn view-only" data-editvf="${key}">Editar</button></div><div class="vf-view view-only">${fmt(value)}</div><textarea id="${id}" class="edit-only" rows="${rows}">${esc(value)}</textarea></div>`;
}
function refreshView(k){
  const rc=modal.querySelector(`[data-rc="${k}"]`), v=readRegion(k); if(!v.texto) return;
  rc.querySelector('[data-vtext]').innerHTML=fmt(v.texto);
  rc.querySelector('[data-vfontes]').textContent=v.fontes?'Fonte: '+v.fontes:'';
  rc.querySelector('[data-vnivel]').textContent=v.nivel?NIVEL[v.nivel]:'';
  rc.dataset.mode='view';
}

   ${it.herd?`<div class="startpt"><b>Ponto de partida (a confirmar)</b><p>${esc(it.herd)}</p></div>`:''}`}
   ${refsFor(it.code).length?`<div class="refblock"><h4>Referências ligadas</h4><ul>${refsFor(it.code).map(r=>`<li><span class="rcode">${esc(r.code)}</span><span>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.titulo)}</a>`:esc(r.titulo)} <span class="muted">· ${esc(r.fonte||'')}${r.dataFonte?', '+esc(r.dataFonte):''}</span></span></li>`).join('')}</ul></div>`:''}

   ${vfField('notas','f-notas','Informações para validação','(o que precisa ser confirmado: dados a checar, fontes em conflito, dúvidas)',EDIT.notas,3)}

function renderDocs(k){
  const ul=modal.querySelector(`[data-docs="${k}"]`); if(!ul) return;
  const docs=(EDIT.regioes[k]||{}).docs||[];
  ul.innerHTML=docs.map((d,ix)=>{ const href=d.assetId?'/_blob/'+d.assetId:d.url; return `<li><a href="${esc(href)}" target="_blank" rel="noopener">${d.assetId?'📄':'🔗'} ${esc(d.nome||href)}</a><button type="button" class="rm" data-rmdoc="${k}:${ix}">Remover</button></li>`; }).join('');
}
function closeModal(){ overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true'); EDIT=null; ORIG=null; EDITTHEME=null; EDITMAPA=null; }
const setMsg=t=>{ const m=document.getElementById('m-msg'); if(m) m.textContent=t; };

async function writeDoc(code,patch){
  patch.updatedAt=new Date().toISOString();
  const ref=DB.doc('respostas/'+code);
  if(RESP[code]) await ref.update(patch); else await ref.set({code,...patch});
  RESP[code]=deepMerge(RESP[code]||{code},patch);
}
function readRegion(k){
  const rc=modal.querySelector(`[data-rc="${k}"]`);
  return { texto:rc.querySelector('[data-f="texto"]').value.trim(), nivel:rc.querySelector('[data-f="nivel"]').value, fontes:rc.querySelector('[data-f="fontes"]').value.trim() };
}
async function save(){
  const it=EDIT.item, isNew=EDIT._new; let code=it.code;
  const patch={};
  if(isNew){
    const texto=modal.querySelector('#n-texto').value.trim();
    if(!texto){ setMsg('Escreva a pergunta antes de salvar.'); return; }
    const tipo=modal.querySelector('#n-tipo').value, esc_=modal.querySelector('#n-esc').value;
    code=nextCode(it.tema,tipo);
    Object.assign(patch,{custom:true,tema:it.tema,tipo,esc:esc_,texto,conds:[...modal.querySelectorAll('.checks input:checked')].map(i=>i.value)});
    it.esc=esc_;
  }
  const selSt=modal.querySelector('#f-status').value, before=isNew?'naopreenchido':statusOf(code);
  const anyText=!!readRegion(pkOf(it)).texto;
  const status=selSt===before?(anyText?'preenchido':'naopreenchido'):selSt;
  if(status!==(ORIG.status||'')||isNew) patch.status=status;
  const cons=modal.querySelector('#f-cons'); if(cons&&cons.value.trim()!==(ORIG.consolidado||'')) patch.consolidado=cons.value.trim();
  const notas=modal.querySelector('#f-notas').value.trim(); if(notas!==(ORIG.notas||'')) patch.notas=notas;
  keysOf(it).forEach(k=>{
    const now=readRegion(k), was=(ORIG.regioes||{})[k]||{};
    if(now.texto!==(was.texto||'')||now.nivel!==(was.nivel||'')||now.fontes!==(was.fontes||'')){ patch.regioes=patch.regioes||{}; patch.regioes[k]=now; }
  });
  if(!Object.keys(patch).length){ closeModal(); return; }
  const btn=modal.querySelector('[data-save]'); btn.disabled=true; setMsg('Salvando…');
  try{ await writeDoc(code,patch); closeModal(); renderAll(); }
  catch(e){ btn.disabled=false; setMsg(e?.code==='invalid_argument'?'Sem permissão para editar este pre-work.':e?.code==='quota_exceeded'?'Limite de armazenamento atingido.':'Não foi possível salvar. Tente de novo.'); }
}
async function persistDocs(k){
  const code=EDIT.item.code, docs=(EDIT.regioes[k]||{}).docs||[];
  await writeDoc(code,{regioes:{[k]:{docs}}});
  ORIG.regioes=ORIG.regioes||{}; ORIG.regioes[k]={...(ORIG.regioes[k]||{}),docs};
}
const TYPES={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',md:'text/markdown',txt:'text/plain',csv:'text/csv',json:'application/json'};
async function uploadFile(inp){
  const k=inp.dataset.file, file=inp.files[0]; if(!file) return;
  const type=TYPES[file.name.split('.').pop().toLowerCase()];
  if(!type){ setMsg('Formato não aceito. Para Word, Excel ou PowerPoint, adicione como link.'); inp.value=''; return; }
  setMsg('Enviando '+file.name+'…');
  try{
    const r=await ASSETS.upload(file,{type});
    EDIT.regioes[k]=EDIT.regioes[k]||{};
    EDIT.regioes[k].docs=[...(EDIT.regioes[k].docs||[]),{nome:file.name,assetId:r.id,tipo:type,addedAt:new Date().toISOString()}];
    await persistDocs(k); renderDocs(k); setMsg('Arquivo anexado a '+labelOf(k)+'.');
  }catch(err){ const c=err?.code; setMsg(c==='too_large'?'Arquivo acima de 20 MB.':c==='unsupported_type'?'Formato não aceito.':c==='rate_limited'?'Muitos envios seguidos. Aguarde e tente de novo.':c==='quota_or_state'?'Espaço de arquivos esgotado.':'Não foi possível enviar o arquivo.'); }
  inp.value='';
}
async function addLink(k){
  const row=modal.querySelector(`[data-linkrow="${k}"]`), url=row.querySelector('[data-lu]').value.trim(), nome=row.querySelector('[data-ln]').value.trim();
  if(!/^https?:\/\//i.test(url)){ setMsg('Cole um link que comece com http:// ou https://'); return; }
  EDIT.regioes[k]=EDIT.regioes[k]||{};
  EDIT.regioes[k].docs=[...(EDIT.regioes[k].docs||[]),{nome:nome||url,url,addedAt:new Date().toISOString()}];
  try{ await persistDocs(k); renderDocs(k); row.querySelector('[data-lu]').value=''; row.querySelector('[data-ln]').value=''; row.hidden=true; setMsg('Link adicionado a '+labelOf(k)+'.'); }
  catch{ setMsg('Não foi possível gravar o link.'); }
}
async function removeDoc(spec){
  const [k,ix]=spec.split(':'); const docs=(EDIT.regioes[k]||{}).docs||[]; const d=docs[+ix]; if(!d) return;
  if(!confirm(`Remover "${d.nome}"?${d.assetId?' O arquivo será apagado de vez.':''}`)) return;
  EDIT.regioes[k].docs=docs.filter((_,i)=>i!==+ix);
  try{ await persistDocs(k); if(d.assetId&&ASSETS){ try{ await ASSETS.delete(d.assetId); }catch{} } renderDocs(k); setMsg('Documento removido.'); }
  catch{ setMsg('Não foi possível remover.'); }
}
async function delItem(){
  const code=EDIT.item.code;
  if(!confirm(`Excluir ${code}? As respostas e os registros dos documentos serão apagados.`)) return;
  try{ await DB.doc('respostas/'+code).delete(); delete RESP[code]; closeModal(); renderAll(); }catch{ setMsg('Não foi possível excluir.'); }
}

const terrName=k=>(TERR_REF.find(x=>x[0]===k)||[k,k])[1];
function matchRef(r){
  if(FR.terr&&!(r.territorios||[]).includes(FR.terr)) return false;
  if(FR.tipo&&r.tipo!==FR.tipo) return false;
  if(FR.conf&&r.confiabilidade!==FR.conf) return false;
  if(FR.ver&&(r.verificada||'averificar')!==FR.ver) return false;
  if(!FR.q) return true;
  const q=FR.q.toLowerCase();
  return [r.code,r.titulo,r.fonte,r.achado,(r.perguntas||[]).join(' ')].some(v=>String(v||'').toLowerCase().includes(q));
}
function refCard(r){
  const ver=(r.verificada||'averificar');
  return `<article class="ref">
   <div class="rh"><span class="rcode">${esc(r.code)}</span><span class="st ${ver==='verificada'?'st-respondida':'st-aberta'}">${VER[ver]}</span></div>
   <h4>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.titulo)}</a>`:esc(r.titulo)}</h4>
   <div class="meta">${esc(r.fonte||'Fonte não informada')} · fonte de ${esc(r.dataFonte||'data não informada')}${r.periodo?' · dados de '+esc(r.periodo):''}</div>
   ${r.achado?`<p class="ach">${fmt(r.achado)}</p>`:''}
   <div class="tg">${r.tipo?`<span class="tag">${esc(r.tipo)}</span>`:''}${r.nivel?`<span class="tag">${NIVEL[r.nivel]}</span>`:''}${r.confiabilidade?`<span class="tag">Confiabilidade ${CONF[r.confiabilidade].toLowerCase()}</span>`:''}${(r.territorios||[]).map(k=>`<span class="rg on">${k==='gl'?'GL':(REG.find(x=>x[0]===k)||[0,0,k])[2]}</span>`).join('')}</div>
   ${(r.perguntas||[]).length?`<div class="tg qs">${r.perguntas.map(c=>getItem(c)?`<button class="qbtn" data-open="${esc(c)}">${esc(c)}</button>`:`<span class="tag">${esc(c)}</span>`).join('')}</div>`:''}
   <button class="edit" data-editref="${esc(r.code)}" ${READY?'':'disabled'}>Editar</button></article>`;
}
function renderRefs(){
  const all=Object.values(REFS), list=all.filter(matchRef).sort((a,b)=>String(b.addedAt||'').localeCompare(String(a.addedAt||''))||b.code.localeCompare(a.code,undefined,{numeric:true}));
  const ver=all.filter(r=>r.verificada==='verificada').length;
  const sel=(k,label,opts)=>`<select data-rf="${k}" aria-label="${label}"><option value="">${label}: todos</option>${opts.map(([v,n])=>`<option value="${v}" ${FR[k]===v?'selected':''}>${n}</option>`).join('')}</select>`;
  return `
  <div class="panel-intro" style="margin-bottom:6px"><h2>Referências consideradas</h2><p class="theme-desc">Fontes consultadas, com data, nível (fato, estimativa ou hipótese), confiabilidade e as perguntas às quais se ligam.</p></div>
  <div class="ref-sum">
   <div class="box"><b>${all.length}</b><span>referências</span></div>
   <div class="box"><b>${ver}</b><span>verificadas em fonte</span></div>
   <div class="box"><b>${all.length-ver}</b><span>a verificar</span></div>
   ${TERR_REF.map(([k,n])=>`<div class="box"><b>${all.filter(r=>(r.territorios||[]).includes(k)).length}</b><span>${n}</span></div>`).join('')}
  </div>
  <div class="filters" role="search" style="margin-top:14px"><input type="search" placeholder="Buscar por título, fonte, achado ou código de pergunta" value="${esc(FR.q)}" data-rq aria-label="Buscar referências">
   ${sel('terr','Território',TERR_REF)}${sel('tipo','Tipo',TIPOS_REF.map(t=>[t,t]))}${sel('conf','Confiabilidade',Object.entries(CONF))}${sel('ver','Verificação',Object.entries(VER))}
   <button class="btn-line" data-newref ${READY?'':'disabled'}>Adicionar referência</button></div>
  <div class="refs">${list.length?list.map(refCard).join(''):`<p class="empty-note">${READY?(all.length?'Nenhuma referência com esses filtros.':'Nenhuma referência ainda.'):'Carregando…'}</p>`}</div>`;
}
function openRef(code){
  const isNew=!code, r=isNew?{territorios:[],perguntas:[]}:clone(REFS[code]);
  EDITREF=isNew?{_new:true}:{code};
  modal.className='modal narrow';
  const opt=(o,v)=>o.map(([a,b])=>`<option value="${a}" ${v===a?'selected':''}>${b}</option>`).join('');

   <div class="row2"><div class="field"><label for="r-fonte">Fonte ou veículo</label><input type="text" id="r-fonte" value="${esc(r.fonte)}"></div><div class="field"><label for="r-url">Link</label><input type="url" id="r-url" value="${esc(r.url)}" placeholder="https://…"></div></div>
   <div class="row2"><div class="field"><label for="r-data">Data da fonte</label><input type="text" id="r-data" value="${esc(r.dataFonte)}" placeholder="ex.: 2026-03-15"></div><div class="field"><label for="r-per">Período dos dados</label><input type="text" id="r-per" value="${esc(r.periodo)}" placeholder="ex.: FY2025"></div></div>
   <div class="row2"><div class="field"><label for="r-tipo">Tipo</label><select id="r-tipo"><option value="">—</option>${opt(TIPOS_REF.map(t=>[t,t]),r.tipo)}</select></div><div class="field"><label for="r-nivel">Nível</label><select id="r-nivel"><option value="">—</option>${opt(Object.entries(NIVEL),r.nivel)}</select></div></div>
   <div class="row2"><div class="field"><label for="r-conf">Confiabilidade</label><select id="r-conf"><option value="">—</option>${opt(Object.entries(CONF),r.confiabilidade)}</select></div><div class="field"><label for="r-ver">Verificação</label><select id="r-ver">${opt(Object.entries(VER),r.verificada||'averificar')}</select></div></div>
   <div class="field"><span class="lbl">Territórios</span><div class="checks">${TERR_REF.map(([k,n])=>`<label><input type="checkbox" data-rt value="${k}" ${(r.territorios||[]).includes(k)?'checked':''}>${n}</label>`).join('')}</div></div>
   <div class="field"><label for="r-perg">Perguntas ligadas <span class="hint">(códigos separados por vírgula, ex.: Q2.6, Q3.1)</span></label><input type="text" id="r-perg" value="${esc((r.perguntas||[]).join(', '))}"></div>
   <div class="field"><label for="r-ach">Achado <span class="hint">(o que a referência diz, em poucas frases)</span></label><textarea id="r-ach" rows="5">${esc(r.achado)}</textarea></div>
